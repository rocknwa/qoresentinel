name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify QoreScan binary and CycloneDX output
        run: |
          qorescan version
          mkdir -p /tmp/qorescan-contracts
          printf 'pragma solidity ^0.8.20; contract Sample { function h(bytes memory x) public pure returns (bytes32) { return keccak256(x); } }\n' > /tmp/qorescan-contracts/Sample.sol
          qorescan solidity /tmp/qorescan-contracts --out /tmp/qorescan-smoke.cbom.json
          python -c "import json; d=json.load(open('/tmp/qorescan-smoke.cbom.json')); assert d['bomFormat']=='CycloneDX' and d['specVersion']=='1.6' and len(d['components'])>0"
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  onchain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Compile contract
        run: npm run build
      - name: Solidity unit tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
